services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - vie-db:/app/db-data
    environment:
      DATABASE_URL: sqlite:////app/db-data/vie.db
      # Point at managed Supabase/Postgres in production instead:
      # DATABASE_URL: postgresql://user:pass@host:5432/vie
      TARGET_FPS: "15.0"
      # LANGCHAIN_TRACING_V2: "true"
      # LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      # VIDEO_LLM_BACKEND: gemini
      # GEMINI_API_KEY: ${GEMINI_API_KEY}

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  uploads:
  vie-db:
