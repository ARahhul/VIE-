server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~ ^/(ingest|jobs|incidents|device-profiles|health) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 500M;
    }
}
